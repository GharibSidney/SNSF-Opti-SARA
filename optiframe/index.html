<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f4">
  <title>OptiFrame</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="OptiFrame by SaraVision">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 64 24">
            <path d="M3 11h5m48 0h5M8 11c0-4 3-7 7-7h7c4 0 7 3 7 7s-3 7-7 7h-7c-4 0-7-3-7-7Zm27 0c0-4 3-7 7-7h7c4 0 7 3 7 7s-3 7-7 7h-7c-4 0-7-3-7-7Zm-6 0h6"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </span>
        <div class="brand-text">
          <h1>OptiFrame</h1>
          <small id="brand-by">par SaraVision</small>
        </div>
      </div>

      <div class="top-actions">
        <div class="language-switcher" aria-label="Language">
          <button type="button" data-lang="fr" class="active">FR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button id="qr-btn" class="qr-button" type="button">QR</button>
      </div>
    </header>

    <section class="flow-card" aria-live="polite">
      <p id="step-label" class="step-label"></p>
      <h2 id="flow-title">Prendre une photo du verre gauche</h2>
      <p id="flow-help" class="flow-help">
        Placez le verre correctement puis prenez une photo.
      </p>

      <button id="camera-btn" class="primary action-button" type="button">
        Prendre une photo 
      </button>

      <button id="upload-btn" class="upload-link" type="button">
        ou téléverser une photo
      </button>

      <!-- Fallback only: native camera when getUserMedia is unavailable -->
      <input
        id="camera-input"
        type="file"
        accept="image/*"
        capture="environment"
        hidden
      >
      <input
        id="file-input"
        type="file"
        accept="image/*"
        hidden
      >

      <div id="loading" class="loading" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="loading-text">Analyse en cours…</span>
      </div>

      <button id="dl-stl" class="primary action-button" type="button" hidden disabled>
        Télécharger le fichier STL
      </button>

      <button id="svg-left-btn" class="secondary action-button" type="button" hidden>
        Exporter le contour gauche (SVG 1:1)
      </button>

      <button id="svg-right-btn" class="secondary action-button" type="button" hidden>
        Exporter le contour droit (SVG 1:1)
      </button>

      <button id="retry-btn" class="secondary action-button" type="button" hidden>
        Réessayer
      </button>

      <p id="status" class="status" role="status"></p>
    </section>
  </main>

  <dialog id="qr-dialog">
    <div id="qr-box"></div>
    <p class="qr-url"></p>
    <form method="dialog"><button id="qr-close">Fermer</button></form>
  </dialog>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
